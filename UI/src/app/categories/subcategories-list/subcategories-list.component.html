<div class="container">
  <div class="list">
    <ng-container *ngIf="!selectedSubCategory">
      <div class="subcategories">
        <button *ngFor="let subCategory of subCategories" type="button" (click)="selectSubCategory(subCategory.id)">
          <app-awesome-icons [selectedIcon]="subCategory.icon"></app-awesome-icons>
          <span class="title">{{ subCategory.name }}</span>
        </button>
      </div>
      <div *ngIf="emptyList">
        <p>Няма добавени подкатегории...</p>
      </div>
    </ng-container>
    <div class="articles">
      <ng-container *ngIf="articles$ | async as articles; else loading">
        <app-articles [articles]="articles"></app-articles>
      </ng-container>
      <ng-template #loading>
        <p class="loading">Зареждане...</p>
      </ng-template>
    </div>
  </div>
</div>
