<app-loader></app-loader>
<div class="container">
  <div class="list">
    <div class="title">
      <input type="submit" value="Добави пост" (click)="addPost()" />
    </div>
    <ng-container *ngIf="posts">
      <table>
        <thead>
          <tr>
            <th>Име</th>
            <!---th>URL-handle</th-->
            <th>Снимка</th>
            <th>Публикуван</th>
            <th>Дата</th>            
            <th></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let post of posts">
            <th class="text-content">{{ post.postName }}</th>
            <!--th class="text-content">{{ category.urlHandle }}</th-->
            <th>
              <img [src]="post.thumbnailImage" alt="" />
            </th>
            <th class="text-content">{{ post.isPublished ? "да " : "не" }}</th>

            <th class="text-content">{{ post.updatedDate }}</th>

            <th class="text-content">
                <a
                  class="editIcon"
                  [routerLink]="['/admin/edit-category', post.id]"
                >
                  <fa-icon [icon]="faPenToSquare"></fa-icon>
                </a>
                <a>
                  <fa-icon
                    [icon]="faTrashCan"
                    (click)="onDelete(post.id)"
                  ></fa-icon>
                </a>
            </th>
          </tr>
        </tbody>
      </table>
    </ng-container>
  </div>
</div>
