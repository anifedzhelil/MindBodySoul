<div class="form-container">
  <form #form="ngForm" (ngSubmit)="onFormSubmit(form)">
    <h2>Добави категория</h2>
    <div class="field">
      <label for="name">Име *</label>
      <input type="text" id="categoryName" class="form-control" name="categoryName" required [(ngModel)]="model.name"
        #inputCategoryName="ngModel" />
    </div>
    <ng-container *ngIf="inputCategoryName.touched">
      <p *ngIf="inputCategoryName?.errors?.['required']" class="error">
        Въведете име на категория!
      </p>
    </ng-container>
    <div class="field">
      <label for="url-handle">URL адрес *</label>
      <app-url-handle appUrlHandlePattern [title]="model.name" [(ngModel)]="model.urlHandle" name="urlHandle" required
        #urlHandle="ngModel">
      </app-url-handle>
      <ng-container *ngIf="urlHandle.touched">
    <p class="error" *ngIf="urlHandle.errors?.['required']">
          Въведете URL адрес!
        </p>
        <p class="error" *ngIf="urlHandle.errors?.['pattern']">
          Само малки латински букви, цифри и тирета!
        </p>
      </ng-container>
    </div>
    <div class="field">
      <label for="image">Снимка *</label>
      <img *ngIf="previewUrl" [src]="previewUrl" alt="Article Image" on />
      <input type="file" id="image" ngModel #inputImage="ngModel" name="image" (change)="onFileUploadChange($event)" />
    </div>
    <ng-container *ngIf="inputImage.touched">
      <div class="error" *ngIf="!file">Изберете снимка!</div>
    </ng-container>
    <p class="field">
      <input type="submit" value="Запази" />
    </p>
    <ng-container *ngIf="errorMessage !== ''">
      <p class="error">
        {{ errorMessage }}
      </p>
    </ng-container>
  </form>
</div>
