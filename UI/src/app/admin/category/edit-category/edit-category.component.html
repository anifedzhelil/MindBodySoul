<div class="form-container">
  <ng-container *ngIf="!categoryNotFound; else notFound">
    <form #form="ngForm" (ngSubmit)="onFormSubmit()">
      <h2>Редактирай категория</h2>
      <div class="field">
        <label for="categoryName">Име</label>
        <input type="text" id="categoryName" name="categoryName" [(ngModel)]="category.name"
          #inputCategoryName="ngModel" required />
      </div>
      <ng-container *ngIf="inputCategoryName.touched">
        <p *ngIf="inputCategoryName?.errors?.['required']" class="error">
          Въведете име на категория!
        </p>
      </ng-container>
      <div class="field">
        <label for="urlHandle">Url handle</label>
        <ng-container *ngIf="isLoaded">
          <app-url-handle appUrlHandlePattern [title]="category.name" [(ngModel)]="category.urlHandle" name="urlHandle"
            #urlHandle="ngModel" >
          </app-url-handle>
          <p class="error" *ngIf="urlHandle.errors?.['pattern']">
            Само малки латински букви, цифри и тирета!
          </p>
        </ng-container>
      </div>
      <div class="field">
        <label for="newImage">Снимка</label>
        <img name="image" *ngIf="!previewUrl" src="{{ category.image }}" />
        <img *ngIf="previewUrl" [src]="previewUrl" alt="Category Image"/>
        <input type="file" id="newImage" name="newimage" (change)="onFileSelected($event)" ngModel />
      </div>
      <div class="field">
        <input type="submit" value="Запази" />
      </div>
      <ng-container *ngIf="errorMessage !== ''">
        <p class="error">
          {{ errorMessage }}
        </p>
      </ng-container>
    </form>
  </ng-container>

  <ng-template #notFound>
    <div class="container">
      <div class="not-found">Категорията не е намерана!</div>
    </div>
  </ng-template>
</div>
