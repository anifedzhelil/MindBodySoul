<div class="form-container">
  <form #form="ngForm" (ngSubmit)="onFormSubmit(form)">
    <h3>Добави коментар</h3>
    <p class="field">
      <label for="content">Коментар</label>
      <textarea id="content" class="form-control" name="content" required [(ngModel)]="comment"
        #inputContent="ngModel" placeholder="Добавете нов коментар..." rows="6"></textarea>
    </p>
    <ng-container *ngIf="inputContent.touched">
      <p *ngIf="inputContent?.errors?.['required']" class="error">
        Въведете коментар!
      </p>
    </ng-container>

    <p class="field">
      <input type="submit" value="Запази" />
    </p>
    <p class="error">
      {{ this.errorMessage }}
    </p>
  </form>
</div>
