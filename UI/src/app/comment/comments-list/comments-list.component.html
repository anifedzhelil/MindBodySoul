<div *ngIf="allComments" class="list">
  <div *ngFor="let comment of allComments" class="item">
    <div class="details">
      <div class="username">
        <small class="username">{{comment.userName ?? 'Анонимен'  }}</small>
      </div>
      <div class="meta">
        <small>
          {{
          comment.updatedDate == null
          ? (comment.createdDate.toString() | elapsedTime)
          : (comment.updatedDate.toString() | elapsedTime)
          }}</small>
        <div *ngIf="comment.userId === user?.userId">
          <a class="editIcon">
            <fa-icon [icon]="faPenToSquare" (click)="showEditPopup(comment)"></fa-icon>
          </a>
          <a>
            <fa-icon class="error" [icon]="faTrashCan" (click)="showDeletePopup(comment.id)"></fa-icon>
          </a>
        </div>
      </div>
    </div>
    <div class="comment">{{ comment.content }}</div>
  </div>
</div>
<div *ngIf="!allComments?.length">
  <p>Няма добавени коментари.</p>
</div>
<app-edit-comment *ngIf="selectedComment" [comment]="selectedComment" [isHidden]="isPopupHidden"
  [errorMessage]="errorMessage" (saved)="onCommentUpdated($event)" (cancel)="onPopupClosed()"></app-edit-comment>
<app-delete-conformation [isHidden]="isDeletePopupVisible" (delete)="onDeleteConfirmed()" (cancel)="onDeleteCanceled()">
</app-delete-conformation>
