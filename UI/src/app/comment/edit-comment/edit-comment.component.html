<div class="modal" *ngIf="!isHidden">
  <div class="modal-content">
    <form #form="ngForm" (ngSubmit)="onSaved(form)">
      <h3>Редактирай коментар</h3>
      <p class="field">
        <label for="content">Коментар</label>
        <textarea  id="content" name="content" required [(ngModel)]="comment.content" #inputContent="ngModel"
          rows="6"></textarea>
      </p>
      <ng-container *ngIf="inputContent.touched">
        <p *ngIf="inputContent?.errors?.['required']" class="error">
          Въведете коментар!
        </p>
      </ng-container>

      <p class="button-group">
        <input type="submit" value="Запази" />
        <input type="button" value="Откажи" (click)="onCancel()" />
      </p>
      <p class="error">
        {{ this.errorMessage }}
      </p>
    </form>
  </div>
</div>
