<div class="wrapper">
    <h3 class="title" (click)="toggleAccordion()">Тагове <span [class.open]="isOpen">▼</span></h3>
    <div class="content" *ngIf="isOpen">
        <app-search (searchSubmitted)="filterTags($event)" placeholder="Търси таг..."></app-search>
        <div class="tags-list">
            <div *ngFor="let tag of filteredTags" class="tag" [class.active]="tag.id === activeTagId"
                (click)="selectNewTag(tag.id)">
                {{ tag.name }} ({{ tag.articleCount }})
            </div>
        </div>
        <div *ngIf="filteredTags.length === 0" class="no-tags">
            <p>Няма намерени тагове...</p>
        </div>
        <div *ngIf="!isAllTagsShown && filteredTags.length>0 && !isSearching">
            <button class="tags-button" (click)="showAllTags()" value="Покажи всички тагове">Покажи всички тагове</button>
        </div>
        <div *ngIf="isAllTagsShown && filteredTags.length>0 && !isSearching">
            <button class="tags-button less-tags" (click)="showLessTags()" value="Покажи по-малко тагове">Покажи по-малко тагове</button>   
        </div>  
    </div>

</div>
