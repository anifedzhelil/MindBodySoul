<div class="articleList">
  <article *ngFor="let article of articles">
    <div class="imageContent">
      <img [src]="article.imageUrl | cloudinary: 800" alt="Article Image" loading="lazy"/>
    </div>
    <div>
      <div class="title">
        <a [routerLink]="['/articles/articles-details', article.id]">{{ article.title }}</a>
      </div>

      <p [innerHTML]="article.content | slices : 300"></p>
      <a class="read-more" [routerLink]="['/articles/articles-details', article.id]">Прочети повече</a>
    </div>
  </article>
</div>
<div *ngIf="articles?.length  == 0" class="message">
  <p>Няма добавени статии...</p>
</div>
