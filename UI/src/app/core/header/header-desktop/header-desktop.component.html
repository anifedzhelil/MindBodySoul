<div class="header">
    <div class="logo">
        <img src="assets/images/logo.svg" [routerLink]="'/'" />
    </div>
    <div class="content">
        <div class="navbar">
            <nav>
                <ul>
                    <li>
                        <a [routerLink]="'/'" (click)="toggleMenu()" routerLinkActive="active-link"
                            [routerLinkActiveOptions]="{ exact: true }">Начална страница</a>
                    </li>
                    <li>
                        <a class="size" [routerLink]="'/categories'" (click)="toggleMenu()"
                            routerLinkActive="active-link">Категории</a>
                    </li>
                    <li>
                        <a [routerLink]="'/articles'" (click)="toggleMenu()" routerLinkActive="active-link">Статии</a>
                    </li>
                    <ng-container *ngIf="
              user?.userName !== undefined && user?.roles?.includes('Writer')
            ">
                        <li><a [routerLink]="'/admin'" (click)="toggleMenu()" routerLinkActive="active-link">Админ</a>
                        </li>
                    </ng-container>
                    <li>
                        <a [routerLink]="'/contacts'" (click)="toggleMenu()" routerLinkActive="active-link">Контакти</a>
                    </li>
                </ul>
            </nav>
        </div>
       <app-search (searchSubmitted)="onSearch($event)" placeholder="Търси статии..."></app-search>
        <div class="login">
            <ng-container *ngIf="user === undefined; else showLogout">
                <a [routerLink]="'/login'">Вход</a>
            </ng-container>
            <ng-template #showLogout>
                <a name="username" id="username">{{ this.user?.userName }}</a>
                <a (click)="onLogout()">
                    <fa-icon [icon]="faRightFromBracket"></fa-icon>
                    Изход</a>
            </ng-template>
        </div>
    </div>
</div>
